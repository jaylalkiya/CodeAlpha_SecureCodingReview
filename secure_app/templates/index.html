{% extends "base.html" %}
{% block body %}
<div class="card">
  <h2>My notes</h2>
  {% for n in notes %}
    <p><a href="/note/{{ n.id }}">#{{ n.id }} {{ n.title }}</a></p>
  {% else %}
    <p class="tag">No notes yet.</p>
  {% endfor %}
</div>
<div class="card">
  <h2>New note</h2>
  <form method="post" action="/note/new">
    {{ csrf_field() }}
    <input name="title" placeholder="title">
    <textarea name="content" rows="4" placeholder="content"></textarea>
    <button>SAVE</button>
  </form>
</div>
<div class="card">
  <h2>Tools</h2>
  <form action="/tools/ping"><input name="host" placeholder="host to ping, e.g. 127.0.0.1"><button>PING</button></form>
  <p><a href="/download?file=welcome.txt">Download welcome.txt</a> &middot; <a href="/export">Export backup</a></p>
  <form method="post" action="/import">
    {{ csrf_field() }}
    <textarea name="backup" rows="2" placeholder="paste a backup to import"></textarea>
    <button>IMPORT</button>
  </form>
</div>
{% endblock %}
