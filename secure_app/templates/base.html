<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoteVault</title>
<style>
  :root { --bg:#050805; --panel:#0b120b; --line:#1f3a1f; --fg:#b9f5b9; --neon:#39ff14; --dim:#5f8f5f; --red:#ff4d4d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 Consolas, "Courier New", monospace; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 24px; border-bottom:1px solid var(--line); }
  header b { color:var(--neon); letter-spacing:2px; text-shadow:0 0 8px var(--neon); }
  main { max-width:760px; margin:24px auto; padding:0 16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px; margin-bottom:16px; }
  a { color:var(--neon); }
  input, textarea, button { width:100%; margin:4px 0 10px; padding:8px; background:#000; color:var(--fg); border:1px solid var(--line); border-radius:4px; font:inherit; }
  button { background:var(--neon); color:#000; font-weight:bold; cursor:pointer; }
  button.danger { background:transparent; color:var(--red); border-color:var(--red); width:auto; }
  pre { white-space:pre-wrap; word-break:break-all; background:#000; padding:10px; border:1px solid var(--line); }
  .err { color:var(--red); }
  .tag { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header><b>&gt; NOTEVAULT_</b><span class="tag">{{ build }}</span>{% if user %}<a href="/logout">logout [{{ user.username }}]</a>{% endif %}</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
